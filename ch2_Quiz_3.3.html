, "d": "以上皆非。"}, "answer": "c", "explain": ""}, {"id": "Q345", "description": "當遙控無人機受到微小擾動而偏離原來的平衡狀態時，在擾動消失後，不經操作人操縱，自動恢復原來平衡狀態的特性，是指遙控無人機的下列哪種特性？", "options": {"a": "平衡性。", "b": "穩定性。", "c": "操縱性。", "d": "以上皆非。"}, "answer": "b", "explain": ""}, {"id": "Q346", "description": "操作無人飛機時，當升降舵控制往上，相對於「機體中心」作下列哪種動作？", "options": {"a": "向下俯仰。", "b": "向上俯仰。", "c": "右滾。", "d": "左滾。"}, "answer": "b", "explain": ""}, {"id": "Q347", "description": "操作無人飛機時，當升降舵控制往下，飛機相對於「機體中心」作下列哪種動作？", "options": {"a": "向下俯仰。", "b": "向上俯仰。", "c": "右滾。", "d": "左滾。"}, "answer": "a", "explain": ""}, {"id": "Q364", "description": "無人飛機重心位置靠前時，低速飛行時，為了穩定較強的俯仰姿態，可能會有下列哪種情形導致提高不穩定進場的風險？", "options": {"a": "配平可能不足。", "b": "配平可能過大。", "c": "滾轉可能不足。", "d": "滾轉可能過大。"}, "answer": "a", "explain": ""}]</script>

  <script>
  (function(){
    // 上一頁／下一頁：href 由 build.py 依頁序填入；href 為 # 時不動作。鍵盤 ← → 與 PageUp／PageDown 同步觸發，輸入框、對話框內不觸發。
    var prev=document.querySelector('[data-nav="prev"]'),next=document.querySelector('[data-nav="next"]');
    function go(a){var h=a&&a.getAttribute('href');if(h&&h!=='#')location.href=h}
    [prev,next].forEach(function(a){a.addEventListener('click',function(e){if(a.getAttribute('href')==='#')e.preventDefault()})});
    document.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(e.target&&e.target.closest&&e.target.closest('input,textarea,select,video,audio,[contenteditable]'))return;if(document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(next);if(e.key==='ArrowLeft'||e.key==='PageUp')go(prev)});
  })();
  </script>
