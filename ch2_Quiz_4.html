壓力錶讀法差異。", "d": "壓力錶校正值差異。"}, "answer": "b", "explain": ""}, {"id": "Q393", "description": "若遙控無人機操作人未能注意大氣壓力實際值與標準值間之差距並適時修正，可能無法精確掌握何項資訊？", "options": {"a": "實際高度。", "b": "實際航向。", "c": "實際滾轉角。", "d": "實際引擎轉速。"}, "answer": "a", "explain": ""}, {"id": "Q394", "description": "氣象資料顯示某區域之氣壓值有向上提升之趨勢，代表該區域天氣狀況有何種變化？", "options": {"a": "天氣轉壞。", "b": "天氣可能轉好也可能轉壞。", "c": "天氣好轉。", "d": "以上皆非。"}, "answer": "c", "explain": ""}, {"id": "Q395", "description": "氣象資料顯示某區域之氣壓值有向下降低之趨勢，代表該區域天氣狀況有何種變化？", "options": {"a": "天氣好轉。", "b": "天氣轉壞。", "c": "天氣有時晴朗有時轉壞。", "d": "以上皆非。"}, "answer": "b", "explain": ""}, {"id": "Q396", "description": "空氣的水平運動稱為？", "options": {"a": "「雲」。", "b": "「風」。", "c": "「霧」。", "d": "「霾」。"}, "answer": "b", "explain": ""}, {"id": "Q397", "description": "有關風速的單位下列何者為非？", "options": {"a": "公尺/每秒 （m/s）。", "b": "公里/每小時 （km/h）。", "c": "海浬/每小時 （kts）。", "d": "公斤/每小時 （kg）。"}, "answer": "d", "explain": ""}, {"id": "Q398", "description": "遙控無人機通常應於下列哪種風向下起降？", "options": {"a": "順風。", "b": "側風。", "c": "逆風。", "d": "任何風向。"}, "answer": "c", "explain": ""}, {"id": "Q399", "description": "遙控無人飛機於逆風下起飛，不會有以下哪種特性？", "options": {"a": "增加穩定性。", "b": "增加操縱性。", "c": "減少起飛距離。", "d": "減少操縱性。"}, "answer": "d", "explain": ""}, {"id": "Q400", "description": "遙控無人機飛經下列哪個區域較易遭受亂流影響，且其亂流強度與周遭環境有密切關聯？", "options": {"a": "大草原區。", "b": "寬廣湖泊區。", "c": "平坦操場上空。", "d": "深山峽谷區。"}, "answer": "d", "explain": ""}, {"id": "Q401", "description": "當越強勁的風吹過多山地區時，背風面的風場會如何變化？", "options": {"a": "漸趨平穩。", "b": "有時平穩有時不平穩。", "c": "漸趨不平穩。", "d": "不變。"}, "answer": "c", "explain": ""}, {"id": "Q402", "description": "遙控無人機飛航活動期間，可能於任何高度遭遇不同風切狀況，其中以哪一項對其操控性影響最大？", "options": {"a": "超高空風切。", "b": "高空風切。", "c": "向量風切。", "d": "低空風切。"}, "answer": "d", "explain": ""}, {"id": "Q403", "description": "遙控無人機於起降階段突遇風速與風向之明顯改變，不會有下列哪種影響？", "options": {"a": "飛行姿態改變。", "b": "飛行軌跡改變。", "c": "所獲升力改變。", "d": "最大載重改變。"}, "answer": "d", "explain": ""}, {"id": "Q404", "description": "下列針對發生於臺灣地區低空風切之敘述，何者較為正確？", "options": {"a": , "b": "水氣飽和點。", "c": "水氣熔點。", "d": "水氣蒸發點。"}, "answer": "b", "explain": ""}, {"id": "Q417", "description": "水汽飽和時不會產生下列哪種現象？", "options": {"a": "雲。", "b": "霧。", "c": "雨。", "d": "雷爆。"}, "answer": "d", "explain": ""}, {"id": "Q418", "description": "「霧」依其形成條件及特性分有不同種類，下列何者非常用之分類？", "options": {"a": "平流霧。", "b": "蒸氣霧。", "c": "鋒面霧。", "d": "高空霧。"}, "answer": "d", "explain": ""}, {"id": "Q419", "description": "有關平流霧之特點，下列何者為非？", "options": {"a": "日出後消散快速。", "b": "相對濕度較高。", "c": "不容易消散。", "d": "可能發生於沿海區域。"}, "answer": "a", "explain": ""}, {"id": "Q420", "description": "下列哪一種情況能有助於平流霧之消散？", "options": {"a": "風速變小。", "b": "風向轉變。", "c": "溫度升高。", "d": "濕度增高。"}, "answer": "b", "explain": ""}, {"id": "Q421", "description": "有關輻射霧之特點，下列何者為非？", "options": {"a": "日出後漸漸消散。", "b": "大都發生於冬季。", "c": "相較於平流霧比較不容易消散。", "d": "通常地面風速微弱、空氣穩定。"}, "answer": "c", "explain": ""}, {"id": "Q422", "description": "冷空氣因流經溫暖水面之蒸發作用使其中水氣增加，因而凝結成下列哪種霧的型態？", "options": {"a": "蒸氣霧。", "b": "輻射霧。", "c": "山坡霧。", "d": "鋒面霧。"}, "answer": "a", "explain": ""}, {"id": "Q423", "description": "蒸氣霧常出現於下列哪個季節？", "options": {"a": "春夏季節。", "b": "夏末季節。", "c": "秋冬季節。", "d": "春末季節。"}, "answer": "c", "explain": ""}, {"id": "Q424", "description": "於兩股不同性質氣團之交界面，當空氣自高空往下移動自近地面較冷空氣而凝結所成之霧，稱之？", "options": {"a": "鋒面霧。", "b": "山坡霧。", "c": "輻射霧。", "d": "蒸氣霧。"}, "answer": "a", "explain": ""}, {"id": "Q425", "description": "鋒面霧多伴隨何種天氣現象發生？", "options": {"a": "颱風。", "b": "鋒面。", "c": "雷陣雨。", "d": "龍捲風。"}, "answer": "b", "explain": ""}, {"id": "Q426", "description": "平流和輻射兩種物理過程亦可相輔相成，造成下列哪種霧的發生？", "options": {"a": "平流輻射霧。", "b": "山坡霧。", "c": "蒸氣霧。", "d": "鋒面霧。"}, "answer": "a", "explain": ""}, {"id": "Q427", "description": "當周遭空氣溫度下降至低於露點，水氣因此凝結成水滴並附著於地表或建築物上，其稱之？", "options": {"a": "雲。", "b": "露。", "c": "霧。", "d": "霜。"}, "answer": "b", "explain": ""}, {"id": "Q428", "description": "附著於航空器上之露珠若凝結成固態霜，對飛航安全有何影響？", "options": {"a": "對飛安有幫助。", "b": "對飛安可能造成危害。", "c": "對飛安並無影響。", "d": "對飛安有時可能造成危害有時無影響。"}, "answer": "b", "explain": ""}, {"id": "Q429", "description": "附著於機體表面的霜在飛行時不會產生下列哪種情形？", "options": {"a": "擾動流經機翼之空氣。", "b": "降低升力。", "c": "增加阻力。", "d": "增加飛航效率。"}, "answer": "d", "explain": ""}, {"id": "Q430", "description": "於大陸型氣候區域執行深秋早晨之飛行任務前，務必進行下列哪個程序以確保安全？", "options": {"a": "暖身程序。", "b": "點名程序。", "c": "除霜程序。", "d": "冥想程序。"}, "answer": "c", "explain": ""}, {"id": "Q431", "description": "雲有下列哪幾種型態？", "options": {"a": "積狀雲。", "b": "層狀雲。", "c": "卷狀雲。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q432", "description": "雲的型態依據雲所在的高度可以分成下列哪幾種？", "options": {"a": "高雲族。", "b": "中雲族。", "c": "低雲族。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q433", "description": "高雲族高度大約在6,000公尺以上，主要有下列哪幾種？", "options": {"a": "卷雲。", "b": "卷層雲。", "c": "卷積雲。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q434", "description": "中雲族高度大約在2,000~6,000公尺，主要有下列哪幾種？", "options": {"a": "高積雲。", "b": "高層雲。", "c": "雨層雲。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q435", "description": "低雲族高度位於2,000公尺以下，包含下列哪幾種？", "options": {"a": "積雲。", "b": "層雲。", "c": "層積雲。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q436", "description": "下列何者為常見氣團分類方式？", "options": {"a": "依其源地緯度高或低。", "b": "依其源地為大陸或海洋。", "c": "依其所經地面為冷空氣或暖空氣。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q437", "description": "氣團本身冷於周遭空氣稱為？", "options": {"a": "暖氣團。", "b": "冷氣團。", "c": "冰氣團。", "d": "熱氣團。"}, "answer": "b", "explain": ""}, {"id": "Q438", "description": "氣團穩定度決定其籠罩區域的哪種形態？", "options": {"a": "社會形態。", "b": "經濟形態。", "c": "天氣形態。", "d": "政治形態。"}, "answer": "c", "explain": ""}, {"id": "Q439", "description": "在鋒面兩側的下列哪種現象通常均有明顯的差異？", "options": {"a": "溫度。", "b": "濕度。", "c": "風、天氣。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q440", "description": "當冷空氣前進，迫使暖空氣後退而取代暖空氣原有位置，則此時產生之鋒面稱為？", "options": {"a": "滯留鋒。", "b": "暖鋒。", "c": "冷鋒。", "d": "囚錮鋒。"}, "answer": "c", "explain": ""}, {"id": "Q441", "description": "當冷暖氣團勢均力敵以致使鋒面呈滯留狀態，此時之鋒面稱為？", "options": {"a": "暖鋒。", "b": "滯留鋒。", "c": "冷鋒。", "d": "囚錮鋒。"}, "answer": "b", "explain": ""}, {"id": "Q442", "description": "遙控無人機飛經各鋒面區時，可能遭遇下列何項劇烈變化？", "options": {"a": "溫度。", "b": "濕度。", "c": "風向。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q443", "description": "遙控無人機於山區飛行時若遇強風，則可選擇何處飛行相較為平順？", "options": {"a": "背風面。", "b": "側風面。", "c": "迎風面。", "d": "以上皆非。"}, "answer": "c", "explain": ""}, {"id": "Q444", "description": "遙控無人機於山區飛行時，過了山巔需注意沿何方向所產生之亂流？", "options": {"a": "側風面。", "b": "背風面。", "c": "迎風面。", "d": "以上皆非。"}, "answer": "b", "explain": ""}, {"id": "Q445", "description": "遙控無人機飛越可見水氣（如雨或雲）時，需注意哪個部位可能發生積冰現象？", "options": {"a": "機翼翼面。", "b": "尾翼翼面。", "c": "感測器。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q446", "description": "遙控無人機飛行時，於下列哪種情形可能發生積冰現象？", "options": {"a": "機體周遭氣溫為攝氏零度。", "b": "機體周遭氣溫為攝氏零度以下。", "c": "有可見水氣。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q447", "description": "當遙控無人機飛越結冰區域時，可能發生下列哪種狀況？", "options": {"a": "影響或誤判遙控無人機飛行性能表現。", "b": "提升遙控無人機飛行性能表現。", "c": "遙控無人機飛行性能表現可能變好或變壞。", "d": "不太可能發生任何狀況。"}, "answer": "a", "explain": ""}, {"id": "Q448", "description": "雷雨的發展循環不包含下列何者？", "options": {"a": "發展期。", "b": "成熟期。", "c": "重疊期。", "d": "消散期。"}, "answer": "c", "explain": ""}, {"id": "Q449", "description": "雷雨成熟期具有的特徵為何？", "options": {"a": "下沉氣流。", "b": "開始降水。", "c": "打雷。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q450", "description": "雷雨消散期具有的特徵為何？", "options": {"a": "降雨減緩。", "b": "下沉氣流減緩。", "c": "雷雨雹消散。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q451", "description": "臺北航空氣象中心隸屬於下列哪個機關？", "options": {"a": "交通部觀光局飛航服務總臺。", "b": "交通部民用航空局飛航服務總臺。", "c": "交通部中央氣象局飛航服務總臺。", "d": "交通部航政司飛航服務總臺。"}, "answer": "b", "explain": ""}, {"id": "Q452", "description": "遙控無人機操作人可透過中央氣象局網頁取得下列哪項資料？", "options": {"a": "天氣觀測資料。", "b": "天氣預報資料。", "c": "衛星雲圖。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q453", "description": "遙控無人機操作人可透過飛航服務總臺所建置之航空氣象服務網(AOAWS)取得下列哪項資料？", "options": {"a": "國內外主要機場之即時觀測資料。", "b": "國內機場6小時天氣預報資料。", "c": "太平洋 當壓力加倍，則空氣密度將為哪種變化？", "options": {"a": "亦為加倍。", "b": "減半。", "c": "增加4倍。", "d": "減少為1/4。"}, "answer": "a", "explain": ""}, {"id": "Q466", "description": "於一定體積下，空氣之溫度與密度成何項關係？", "options": {"a": "溫度與密度成正比。", "b": "溫度與密度成反比。", "c": "溫度與密度的平方成正比。", "d": "溫度與密度的平方成反比。"}, "answer": "b", "explain": ""}, {"id": "Q467", "description": "「國際標準大氣」是指在假設大氣環境下，海平面之大氣壓力和溫度分別為何？", "options": {"a": "29.92吋汞柱/攝氏25度。", "b": "29.92吋汞柱/攝氏15度。", "c": "39.92吋汞柱/攝氏15度。", "d": "39.92吋汞柱/攝氏25度。"}, "answer": "b", "explain": ""}, {"id": "Q468", "description": "於對流層中，高度每上升1,000呎，溫度如何變化？", "options": {"a": "降低約攝氏2度。", "b": "升高約攝氏2度。", "c": "降低約攝氏20度。", "d": "升高約攝氏20度。"}, "answer": "a", "explain": ""}, {"id": "Q469", "description": "高度每上升1,000呎，氣壓值如何變化？", "options": {"a": "減少約10吋汞柱。", "b": "增加約10吋汞柱。", "c": "減少約1吋汞柱。", "d": "增加約1吋汞柱。"}, "answer": "c", "explain": ""}, {"id": "Q470", "description": "氣象上定義風的來向為風向，例如風自東邊吹來，稱其為？", "options": {"a": "西風。", "b": "東風。", "c": "南風。", "d": "北風。"}, "answer": "b", "explain": ""}, {"id": "Q471", "description": "當遙控無人飛機於起飛時遭遇較強之正側風，可能導致下列哪種風險？", "options": {"a": "操作人視線不清。", "b": "導控距離變短。", "c": "翼面與地面接觸。", "d": "起飛距離變短。"}, "answer": "c", "explain": ""}, {"id": "Q472", "description": "當遙控無人飛機於降落時遭遇較強之正側風，可能導致下列哪種風險？", "options": {"a": "落地後偏離跑道。", "b": "操作人視線不清。", "c": "導控距離變短。", "d": "降落距離變短。"}, "answer": "a", "explain": ""}, {"id": "Q473", "description": "遙控無人直昇機及遙控無人多旋翼機，由於可垂直起降，因此對於風向之考量多著重於下列何者？", "options": {"a": "起降時遇到較強的正側風。", "b": "滯空飛行時的穩定度。", "c": "避免順風起降。", "d": "不要遮蔽操作人視線。"}, "answer": "b", "explain": ""}, {"id": "Q474", "description": "大氣中不同兩點間風速或風向之劇烈變化，稱之為何？", "options": {"a": "風流。", "b": "風切。", "c": "風格。", "d": "風氣。"}, "answer": "b", "explain": ""}, {"id": "Q475", "description": "風切可能伴隨下列哪種現象？", "options": {"a": "垂直氣流。", "b": "焚風氣流。", "c": "旋風氣流。", "d": "離心氣流。"}, "answer": "a", "explain": ""}, {"id": "Q476", "description": "所謂低空風切，我國定義係指下列哪個高度範圍之空氣層中，其風向或風速之突然變化？", "options": {"a": "10,000~15,000呎。", "b": "5,000~10,000呎。", "c": "1,600~5,000呎。", "d": "1,600呎以下。"}, "answer": "d", "explain": ""}, {"id": "Q477", "description": "微爆氣流的循環約在5到15分鐘之間，所產生之下沉氣流可達下列何項速度？", "options": {"a": "每分鐘600呎。", "b": "每分鐘6,000呎。", "c": "每分鐘20,000呎。", "d": "每分鐘50,000呎。"}, "answer": "b", "explain": ""}, {"id": "Q478", "description": "微爆氣流頂風與尾風的速度差距可達哪項範圍？", "options": {"a": "30到90節。", "b": "5到10節。", "c": "10到20節。", "d": "20到30節。"}, "answer": "a", "explain": ""}, {"id": "Q479", "description": "淺層的逆溫層一般來說高度為下列何者？", "options": {"a": "約離地5,000公尺。", "b": "約離地3,000公尺。", "c": "約離地1,000公尺。", "d": "約離地300公尺。"}, "answer": "d", "explain": ""}, {"id": "Q480", "description": "同樣體積之空氣溫度愈高，能容納之水氣為何？", "options": {"a": "愈多。", "b": "愈少。", "c": "不變。", "d": "有時愈多有時愈少。"}, "answer": "a", "explain": ""}, {"id": "Q481", "description": "在一定大氣壓力下，空氣中水氣含量固定不變時，若氣溫降至相當溫度使空氣飽和，氣溫再稍低，水氣即行凝結，此時之溫度，稱為下列哪種狀況？", "options": {"a": "露點。", "b": "沸點。", "c": "霜點。", "d": "熔點。"}, "answer": "a", "explain": ""}, {"id": "Q482", "description": "暖空氣經過冷地表時，暖空氣受地表影響降溫，可使水氣達到下列哪個狀態？", "options": {"a": "不飽和狀態。", "b": "半飽和狀態。", "c": "飽和狀態。", "d": "超飽和狀態。"}, "answer": "c", "explain": ""}, {"id": "Q483", "description": "當空氣溫度達到或接近露點時，空氣中的水氣就會逐漸凝結，進而發生會影響能見度的下列哪種狀況？", "options": {"a": "霜。", "b": "露。", "c": "霧。", "d": "以上皆是。"}, "answer": "c", "explain": ""}, {"id": "Q484", "description": "當溫暖且潮溼的空氣流經較冷的地面時，低層空氣中的水氣會因冷卻作用而凝結形成霧，稱之為下列哪種霧？", "options": {"a": "平流霧。", "b": "山坡霧。", "c": "鋒面霧。", "d": "蒸氣霧。"}, "answer": "a", "explain": ""}, {"id": "Q485", "description": "通常出現在冬季晴朗、微風、近地面水氣充沛的夜間或清晨的霧，稱之為下列哪種霧？", "options": {"a": "輻射霧。", "b": "山坡霧。", "c": "鋒面霧。", "d": "蒸氣霧。"}, "answer": "a", "explain": ""}, {"id": "Q486", "description": "當濕空氣沿山坡上升時，經絕熱冷卻而成的霧，稱之為下列哪種霧？", "options": {"a": "山坡霧。", "b": "輻射霧。", "c": "蒸氣霧。", "d": "鋒面霧。"}, "answer": "a", "explain": ""}, {"id": "Q487", "description": "平流輻射霧好發生於下列哪種季節地點？", "options": {"a": "春末夏初台灣東部地區。", "b": "夏末秋初台灣北部地區。", "c": "冬末春初台灣西部地區。", "d": "秋末冬初台灣南部地區。"}, "answer": "c", "explain": ""}, {"id": "Q488", "description": "水氣若溫度低於冰點即凝結成下列哪種現象？", "options": {"a": "雲。", "b": "霜。", "c": "露。", "d": "霧。"}, "answer": "b", "explain": ""}, {"id": "Q489", "description": "氣團從發源地移出後，與不同屬性的氣團相遇，而性質不同之冷暖兩氣團相遇時，其交界處稱為下列哪種現象？", "options": {"a": "鋒面。", "b": "界面。", "c": "團面。", "d": "表面。"}, "answer": "a", "explain": ""}, {"id": "Q490", "description": "遙控無人機若是嚴重結冰則可能會導致下列哪種狀況？", "options": {"a": "推力不足而失速。", "b": "重心偏移而失速。", "c": "升力不足而失速。", "d": "以上皆是。"}, "answer": "c", "explain": ""}, {"id": "Q491", "description": "雷雨發展期的特徵是下列哪種現象？", "options": {"a": "下沉氣流。", "b": "上升氣流。", "c": "垂直風切。", "d": "水平風切。"}, "answer": "b", "explain": ""}, {"id": "Q492", "description": "不宜在下列哪個範圍操作遙控無人機？", "options": {"a": "成長快速的積雲附近。", "b": "遠離成長快速的積雲。", "c": "不明顯且成長停滯的積雲附近。", "d": "以上皆非。"}, "answer": "a", "explain": ""}, {"id": "Q493", "description": "雷雨成熟期的上升氣流及下沉氣流互相交錯，產生下列哪種現象？", "options": {"a": "水平風切。", "b": "垂直風切。", "c": "低空風切。", "d": "微爆氣流。"}, "answer": "b", "explain": ""}, {"id": "Q494", "description": "航空氣象裡的機場觀測項目中，觀測人員就機場現時觀測之結果，原則上在下列哪個時間間隔編報「航空例行天氣報告（METAR）」？", "options": {"a": "每5分鐘或10分鐘。", "b": "每30分鐘或60分鐘。", "c": "每6小時或12小時。", "d": "每24小時或36小時。"}, "answer": "b", "explain": ""}, {"id": "Q495", "description": "航空氣象裡的預報資料項目中，針對機場的天氣預報原則上在下列哪個時間間隔編報「終端機場天氣預報（TAF）」？", "options": {"a": "每24小時。", "b": "每12小時。", "c": "每6小時。", "d": "每2小時。"}, "answer": "c", "explain": ""}, {"id": "Q496", "description": "航空例行天氣報告中，觀測場站之識別碼：觀測發生之機場，我國機場識別碼前兩碼均為下列哪兩個英文字母？", "options": {"a": "QQ。", "b": "RC。", "c": "AA。", "d": "BB。"}, "answer": "b", "explain": ""}, {"id": "Q497", "description": "航空例行天氣報告中，風向及風速：機場風向風速之觀測值，使用觀測下列哪個期間之平均風向與平均風速之編報？", "options": {"a": "前1分鐘。", "b": "前10分鐘。", "c": "前60分鐘。", "d": "前180分鐘。"}, "answer": "b", "explain": ""}, {"id": "Q498", "description": "航空例行天氣報告中，雲量是指下列哪個定義？", "options": {"a": "雲在天空中的烏黑程度。", "b": "雲在天空中的高度。", "c": "雲在天空中遮蓋的份數。", "d": "雲在天空中的移動速度。"}, "answer": "c", "explain": ""}, {"id": "Q499", "description": "遙控無人機操作人針對不同壓力高度對於無人機起降滑行距離之影響，應有何種正確認知？", "options": {"a": "只要載重固定，起降滑行距離不受壓力高度變化影響。", "b": "起降滑行距離與跑道鋪面、坡度及地面風向有關，無關壓力高度。", "c": "壓力高度影響空氣密度，進而影響爬升率，對於起降滑行距離有直接影響。", "d": "起降滑行距離與無人機動力來源有關，無關壓力高度。"}, "answer": "c", "explain": ""}, {"id": "Q500", "description": "「霧」對於無人機起降活動之影響顯而易見，請問下列針對「霧」的成因判斷，何者最為恰當？", "options": {"a": "注意風（空氣水平運動）的狀況，風速增加就可能形成「霧」。", "b": "注意對流（空氣垂直運動）的狀況，對流增強就可能形成「霧」。", "c": "注意大氣壓力值是否降低，降低就可能形成「霧」。", "d": "注意空氣溫度是否接近露點溫度，接近就可能形成「霧」。"}, "answer": "d", "explain": ""}, {"id": "Q501", "description": "無人機結束任務正準備返場，團隊藉由氣象資料得知5邊航線上有風切現象，風速及風向變化劇烈，請問操作人應特別注意風切對無人機之何項影響？", "options": {"a": "引擎轉數可能因此而不穩定。", "b": "資料鏈和GPS可能因此而失效。", "c": "重心可能因此而偏移。", "d": "可能造成升力損失，影響飛航穩定性，甚至無法安全降落。"}, "answer": "d", "explain": ""}, {"id": "Q502", "description": "無人機正於高聳建物附近飛行，因地面上障礙物會影響風的流動，故操作人應特別注意下列何種情形？", "options": {"a": "風速及風向快速變化所產生之亂流。", "b": "加強無人機穩定性及視線。", "c": "發揮無人機性能表現。", "d": "避免資料鏈和GPS可能因風速及風向之變化而失效。"}, "answer": "a", "explain": ""}, {"id": "Q503", "description": "當氣團行經水面和陸地，最終將與另一不同特性的氣團接觸。此兩種不同類型的氣團的邊界層稱為鋒面。請問操作人最容易辨認下列哪一種鋒面中的不連續現象？", "options": {"a": "雲層的增加。", "b": "相對濕度的增加。", "c": "溫度的變化。", "d": "能見度的變化。"}, "answer": "c", "explain": ""}, {"id": "Q504", "description": "當無人機須穿越鋒面進行飛航任務時，操作人應特別注意下列哪一種天氣現象之變化？", "options": {"a": "降水型態之改變。", "b": "風向之改變。", "c": "氣團穩定性之改變。", "d": "相對濕度之改變。"}, "answer": "b", "explain": ""}, {"id": "Q505", "description": "無人機正以定速（40 kts/時）及定姿態方式保持往東飛行，此時GPS速度（地速）顯示為44 kts/時，GPS航向為116度，請問風速和風向約略為何？", "options": {"a": "東風20 kts。", "b": "北風20 kts。", "c": "南風20 kts。", "d": "西風20 kts。"}, "answer": "b", "explain": ""}, {"id": "Q506", "description": "當無人機飛行於標準大氣壓力之環境下，其高度表指示高度（壓力高度）為3,000英呎，請問此時大氣壓力約為多少？", "options": {"a": "28.86英吋汞柱高。", "b": "27.82英吋汞柱高。", "c": "26.82英吋汞柱高。", "d": "25.84英吋汞柱高。"}, "answer": "c", "explain": ""}, {"id": "Q507", "description": "於標準大氣壓力環境下，無人機正於機場(位於水平面)跑道頭準備起飛，此時高度表指示高度（壓力高度）為200英呎，為使無人機壓力高度與機場跑道高度一致，請問操作人應採取下列哪一項動作？", "options": {"a": "壓力高度修正為29.72英吋汞柱高。", "b": "壓力高度修正為27.92英吋汞柱高。", "c": "壓力高度修正為29.52英吋汞柱高。", "d": "壓力高度修正為25.92英吋汞柱高。"}, "answer": "a", "explain": ""}, {"id": "Q508", "description": "無人機正往南的方向飛行前往任務目標區，根據氣象資料顯示，飛行航線上吹著穩定而強勁之北風，其區域及鄰近並無明顯障礙物，請問下列所述狀況何者為操作人較無須擔心事項？", "options": {"a": "強風所持續之時間。", "b": "風速是否超出無人機飛航性能限制。", "c": "是否受到側風過大而影響飛航操作。", "d": "是否因於強風中飛行而消耗更多動力來源，進而降低續航力。"}, "answer": "c", "explain": ""}, {"id": "Q509", "description": "依據雲層佔據整個天空的比例，一般將雲區分成稀雲、疏雲、裂雲、密雲等4個種類。現在收到氣象預報：「早晨疏雲，上午密雲，下午裂雲，晚上稀雲」，請問下列哪一個時段的降雨機率比較大？", "options": {"a": "早晨。", "b": "晚上。", "c": "上午。", "d": "下午。"}, "answer": "c", "explain": ""}]</script>
