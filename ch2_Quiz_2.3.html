tions": {"a": "遙控無人機活動區域。", "b": "遙控無人機活動時間。", "c": "其他管理事項。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q23", "description": "中央主管機關認有禁止或限制遙控無人機飛航活動需求者，得提請所在地哪個機關進行公告？", "options": {"a": "鄉鎮區公所。", "b": "直轄市、縣（市）政府。", "c": "地方派出所。", "d": "地方農會。"}, "answer": "b", "explain": ""}, {"id": "Q24", "description": "政府機關（構）、學校或法人因執行業務需於禁、限航區及航空站或飛行場四周一定距離範圍內從事遙控無人機飛航活動者，應申請何者會商目的事業主管機關同意後，始得為之？", "options": {"a": "鄉鎮區公所。", "b": "衛福部。", "c": "民航局。", "d": "科技部。"}, "answer": "c", "explain": ""}, {"id": "Q25", "description": "政府機關（構）、學校或法人因執行業務需於直轄市、縣（市）政府所公告之遙控無人機活動區域、時間及其他管理事項外從事飛航活動者，應申請何者會商相關中央主管機關同意後，始得為之？", "options": {"a": "直轄市、縣（市）政府。", "b": "衛福部。", "c": "農委會。", "d": "交通部。"}, "answer": "a", "explain": ""}, {"id": "Q26", "description": "遙控無人機未經同意飛入禁航區、限航區，得由何者採取適當措施予以制止或排除？", "options": {"a": "交通警察大隊。", "b": "禁航區、限航區之管理人。", "c": "鄉鎮區公所。", "d": "地方派出所。"}, "answer": "b", "explain": ""}, {"id": "Q27", "description": "遙控無人機未經同意飛入航空站或飛行場四周之一定距離範圍內者，航空站、飛行場之經營人或管理人得會同何者予以取締？", "options": {"a": "當地里長。", "b": "地方派出所。", "c": "航空警察局。", "d": "交通警察大隊。"}, "answer": "c", "explain": ""}, {"id": "Q28", "description": "遙控無人機未經同意飛入直轄市、縣（市）政府所公告之活動區域、時間及其他管理事項外者，得由何者進行取締？", "options": {"a": "直轄市、縣（市）政府。", "b": "鄉鎮區公所。", "c": "地方派出所。", "d": "衛福部。"}, "answer": "a", "explain": ""}, {"id": "Q29", "description": "從事休閒娛樂用途之遙控無人機活動，其飛航實際高度不得逾距地面或水面多少高度？", "options": {"a": "800呎。", "b": "400呎。", "c": "200呎。", "d": "100呎。"}, "answer": "b", "explain": ""}, {"id": "Q30", "description": "從事遙控無人機飛航活動，非經民航局核准不得執行下列何者行為？", "options": {"a": "以信號鏈路進行飛航控制。", "b": "以自動駕駛操作。", "c": "投擲或噴灑任何物件。", "d": "其他經民航局同意之操作。"}, "answer": "c", "explain": ""}, {"id": "Q31", "description": "從事遙控無人機飛航活動，不得裝載哪種物品？", "options": {"a": "光學酬載。", "b": "飛航所需燃油或電池。", "c": "民用航空法所公告之危險物品。", "d": "調整重心所需之配重塊。"}, "answer": "c", "explain": ""}, {"id": "Q33", "description": "從事休閒娛樂用途之遙控無人機不得於下列哪個區域進行飛航活動？", "options": {"a": "人群聚集或室外集會遊行上空。", "b": "經地方政府同意開放無人機活動之公園綠地。", "c": "經地方政府同意開放無人機活動之人煙稀少區。", "d": "經地方政府同意開放無人機活動之河灘地。"}, "answer": "a", "explain": ""}, {"id": "Q34", "description": "從事休閒娛樂用途之遙控無人機不得於下列哪個時間進行飛航活動？", "options": {"a": "日落後至日出前。", "b": "日出後。", "c": "正中午。", "d": "無特別規定。"}, "answer": "a", "explain": ""}, {"id": "Q35", "description": "操作人於從事休閒娛樂用途之遙控無人機飛航活動時，最多得同時控制幾架遙控無人機？", "options": {"a": "1架。", "b": "2架。", "c": "5架。", "d": "10架以上。"}, "answer": "a", "explain": ""}, {"id": "Q36", "description": "操作人於從事遙控無人機飛航活動期間，應留意下列何者？", "options": {"a": "遙控無人機之販售包裝。", "b": "遙控無人機之外觀造型。", "c": "遙控無人機飛航及其周遭狀況。", "d": "以上皆非。"}, "answer": "c", "explain": ""}, {"id": "Q37", "description": "從事遙控無人機飛航活動時，應防止其與何者之接近或碰撞？", "options": {"a": "其他航空器。", "b": "建築物。", "c": "人群。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q38", "description": "政府機關（構）、學校或法人欲執行遙控無人機法規所訂之操作限制者，得檢附相關文書並向下列何者申請核准後為之？", "options": {"a": "直轄市、縣（市）政府。", "b": "民航局。", "c": "警察機關。", "d": "衛福部。"}, "answer": "b", "explain": ""}, {"id": "Q39", "description": "政府機關（構）、學校或法人經民航局核准得於「人群聚集或室外集會遊行上空」進行飛航活動者，其活動場地部分仍應取得何者之同意？", "options": {"a": "直轄市、縣（市）政府及相關中央主管機關。", "b": "直轄市、縣（市）政府。", "c": "相關中央主管機關。", "d": "當地派出所。"}, "answer": "a", "explain": ""}, {"id": "Q40", "description": "操作遙控無人機發生下列哪種情形時，遙控無人機所有人應負賠償責任？", "options": {"a": "故意致他人死傷。", "b": "過失致他人死傷。", "c": "故意或過失毀損他人財物。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q41", "description": "遙控無人機所有人將其遙控無人機交由他人進行操作而不慎墜落傷人，應由何人負連帶賠償責任？", "options": {"a": "所有人及旁觀人。", "b": "所有人及設計者。", "c": "所有人及操作人。", "d": "所有人及製造者。"}, "answer": "c", "explain": ""}, {"id": "Q42", "description": "政府機關（構）、學校或法人於從事民航局核准之遙控無人機飛航活動前，應依法投保責任保險，係依據何法所定之內容？", "options": {"a": "保險法。", "b": "民用航空法。", "c": "民法。", "d": "勞動基準法。"}, "answer": "b", "explain": ""}, {"id": "Q43", "description": "遙控無人機所有人或操作人違反「禁航區、限航區及航空站或飛行場四周之一定距離範圍內從事飛航活動」之相關規定者，民航局除廢止其操作證並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "3萬元以上18萬元以下。", "b": "5萬元以上28萬元以下。", "c": "10萬元以上48萬元以下。", "d": "30萬元以上150萬元以下。"}, "answer": "d", "explain": ""}, {"id": "Q44", "description": "遙控無人機所有人或操作人違反「不得逾距地面或水面高度400呎從事飛航活動」之規定者，民航局除廢止其操作證並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "30萬元以上150萬元以下。", "b": "1萬元以上10萬元以下。", "c": "20萬元以上50萬元以下。", "d": "5萬元以上30萬元以下。"}, "answer": "a", "explain": ""}, {"id": "Q45", "description": "遙控無人機之所有人或操作人違反「未領有操作證而操作遙控無人機」之規定者，除禁止其活動，情節重大者並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "1萬元以上8萬元以下。", "b": "3萬元以上18萬元以下。", "c": "6萬元以上30萬元以下。", "d": "8萬元以上38萬元以下。"}, "answer": "c", "explain": ""}, {"id": "Q46", "description": "遙控無人機之所有人或操作人違反「未投保或未足額投保責任保險而從事遙控無人機活動」之規定者，除禁止其活動，情節重大者並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "6萬元以上30萬元以下。", "b": "3萬元以上20萬元以下。", "c": "1萬元以上8萬元以下。", "d": "8萬元以上50萬元以下。"}, "answer": "a", "explain": ""}, {"id": "Q48", "description": "遙控無人機之所有人或操作人違反「直轄市、縣（市）政府公告之區域、時間及其他管理事項」之相關規定者，除禁止其活動，情節重大者並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "3萬元以上15萬元以下。", "b": "5萬元以上28萬元以下。", "c": "8萬元以上38萬元以下。", "d": "15萬元以上30萬元以下。"}, "answer": "a", "explain": ""}, {"id": "Q49", "description": "遙控無人機之所有人或操作人違反「遙控無人機飛航活動應遵守之規定」者，除禁止其活動，情節重大者並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "10萬元以上48萬元以下。", "b": "8萬元以上38萬元以下。", "c": "5萬元以上28萬元以下。", "d": "3萬元以上15萬元以下。"}, "answer": "d", "explain": ""}, {"id": "Q50", "description": "違反「射頻識別、檢驗、認可、維修與檢查、飛航活動之活動許可及內容、製造者與進口者之登錄及責任、飛航安全相關事件之通報等事項」規定者，除禁止其活動，情節重大者並得沒入遙控無人機外，另處多少新臺幣之罰鍰？", "options": {"a": "1萬元以上150萬元以下。", "b": "5萬元以上498萬元以下。", "c": "8萬元以上798萬元以下。", "d": "10萬元以上998萬元以下。"}, "answer": "a", "explain": ""}, {"id": "Q78", "description": "操作政府機關（構）、學校或法人所有遙控無人機之操作人應持有民航局發給之何種證照，始得操作？", "options": {"a": "機師檢定證。", "b": "操作證。", "c": "維修檢定證。", "d": "鑑定合格證。"}, "answer": "b", "explain": ""}, {"id": "Q82", "description": "操作人從事遙控無人機活動，應於何時依製造者所提供之維修指引對遙控無人機系統進行檢查，以符合安全飛航條件後始得活動？", "options": {"a": "應於飛航活動前執行。", "b": "應於飛航活動後執行。", "c": "應於飛航活動中執行。", "d": "任何時間均可執行。"}, "answer": "a", "explain": ""}, {"id": "Q83", "description": "操作人從事遙控無人機飛航活動前，下列何者非為主要考量因素？", "options": {"a": "氣象條件。", "b": "空域、飛航限制。", "c": "其他空中或地面之危害因素。", "d": "操作者家庭狀況。"}, "answer": "d", "explain": ""}, {"id": "Q84", "description": "有關操作人欲於載具上操作遙控無人機以進行飛航活動，下列敘述何者錯誤？", "options": {"a": "可於固定之導控站上操作。", "b": "可於固定之車輛上操作。", "c": "可於移動中之航空器上操作。", "d": "可於固定之船艦上操作。"}, "answer": "c", "explain": ""}, {"id": "Q85", "description": "哪些單位應檢附文件向民航局申請核准後，始得從事遙控無人機飛航活動？", "options": {"a": "政府機關（構）。", "b": "學校。", "c": "法人。", "d": "以上皆是。"}, "answer": "d", "explain": ""}, {"id": "Q86", "description": "政府機關（構）、學校或法人欲於直轄市、縣（市）政府公告之禁止、限制區域內從事遙控無人機飛航活動者，應至少於活動日前多久檢附計畫書提出申請？", "options": {"a": "30日前。", "b": "20日前。", "c": "15日前。", "d": "10日前。"}, "answer": "c", "explain": ""}, {"id": "Q87", "description": "最大起飛重量2公斤以上且裝置導航設備之遙控無人機遭受實質損害或失蹤時，所有人或操作人應於發生或得知消息後多久內填具飛航安全相關事件報告表通報民航局？", "options": {"a": "6小時內。", "b": "12小時內。", "c": "24小時內。", "d": "48小時內。"}, "answer": "c", "explain": ""}, {"id": "Q88", "description": "當遙控無人機發生與其他航空器或障礙物接近或碰撞之事故時，所有人或操作人應於發生或得知消息後多久內填具飛航安全相關事件報告表通報民航局？", "options": {"a": "6小時內。", "b": "12小時內。", "c": "24小時內。", "d": "48小時內。"}, "answer": "c", "explain": ""}, {"id": "Q89", "description": "當發生遙控無人機飛航安全相關事件時，民航局針對操作人可採取哪項措施？", "options": {"a": "得逕為暫停其操作或飛航活動。", "b": "經操作人同意後，得暫停其操作或飛航活動。", "c": "經所在地方政府同意後，得暫停其操作或飛航活動。", "d": "需待調查結束後並經操作人同意，使得暫停其操作或飛航活動。"}, "answer": "a", "explain": ""}, {"id": "Q90", "description": "根據「遙控無人機管理規則」內容，各項申請及通報作業可透過何處以電子化方式為之？", "options": {"a": "地方政府所建置之資訊系統。", "b": "民航局所指定之資訊系統。", "c": "財政部所建置資訊系統。", "d": "經濟部所建置資訊系統。"}, "answer": "b", "explain": ""}, {"id": "Q92", "description": "遙控無人機於發生飛航安全相關事件後，何人應負責進行通報？", "options": {"a": "僅有所有人。", "b": "僅有操作人。", "c": "所有人或操作人。", "d": "操作人之親屬。"}, "answer": "c", "explain": ""}, {"id": "Q93", "description": "操作人未經獲准從事視距外之遙控無人機飛航活動，除不得使用矯正鏡片外之任何工具做延伸視距飛航外，另須遵守哪項飛航範圍限制？", "options": {"a": "須於信號鏈路有效範圍內操作。", "b": "須於目視範圍內操作。", "c": "須於自動駕駛有效範圍內操作。", "d": "須於安全油量範圍內操作。"}, "answer": "b", "explain": ""}, {"id": "Q94", "description": "有關政府機關（構）、學校或法人欲執行獲民航局許可之遙控無人機飛航任務，下列敘述何者正確？", "options": {"a": "飛航任務後應向民航局申請該次活動許可。", "b": "飛航任務時應向民航局申請該次活動許可。", "c": "飛航任務前應向民航局申請該次活動許可。", "d": "不須向民航局申請該次活動許可。"}, "answer": "c", "explain": ""}, {"id": "Q95", "description": "遙控無人機管理規則針對「延伸視距飛航」之定義，下列何者為非？", "options": {"a": "操作人須於視距外操作。", "b": "目視觀察員須距遙控無人機半徑三百公尺範圍內。", "c": "操作人應自目視觀察員獲取必要飛航資訊。", "d": "目視觀察員不須與遙控無人機保持直接目視接觸。"}, "answer": "d", "explain": ""}, {"id": "Q96", "description": "遙控無人機管理規則如何定義「延伸視距最大範圍」？", "options": {"a": "以遙控無人機操作人為中心，半徑900公尺、相對地面或水面高度低於400呎內之區域。", "b": "以遙控無人機操作人為中心，半徑600公尺、相對地面或水面高度低於300呎內之區域。", "c": "以遙控無人機操作人為中心，半徑500公尺、相對地面或水面高度低於200呎內之區域。", "d": "以遙控無人機操作人為中心，半徑1,200公尺、相對地面或水面高度低於200呎內之區域。"}, "answer": "a", "explain": ""}, {"id": "Q100", "description": "法規規定最大起飛重量達多少以上且裝置導航設備之遙控無人機，應具備防止其進入禁、限航區及航空站或飛行場四周一定距離範圍內之圖資軟體系統？", "options": {"a": "250公克以上。", "b": "1公斤以上。", "c": "2公斤以上。", "d": "15公斤以上。"}, "answer": "b", "explain": ""}, {"id": "Q107", "description": "操作人操作遙控無人機時，血液中酒精濃度依法不得超過多少？", "options": {"a": "0.01%。", "b": "0.02%。", "c": "0.04%。", "d": "0.06%。"}, "answer": "b", "explain": ""}, {"id": "Q108", "description": "最大起飛重量未達25公斤且裝置導航設備之遙控無人機，其最大飛行速度不得超過多少？", "options": {"a": "70海浬/小時。", "b": "87海浬/小時。", "c": "100海浬/小時。", "d": "150海浬/小時。"}, "answer": "b", "explain": ""}, {"id": "Q109", "description": "政府機關（構）、學校或法人欲於禁、限航區及航空站或飛行場四周一定距離範圍內從事遙控無人機飛航活動者，應於活動日前多久提出申請？", "options": {"a": "15日前。", "b": "10日前。", "c": "5日前。", "d": "3日前。"}, "answer": "a", "explain": ""}, {"id": "Q110", "description": "政府機關（構）、學校或法人於涉及軍事航空管理機關（構）管理之禁、限航區及航空站或飛行場四周一定距離範圍內從事遙控無人機飛航活動者，應於活動日前多久提出申請？", "options": {"a": "30日前。", "b": "20日前。", "c": "15日前。", "d": "10日前。"}, "answer": "a", "explain": ""}, {"id": "Q111", "description": "政府機關（構）、學校或法人於直轄市、縣（市）政府公告之禁止、限制區域內從事遙控無人機飛航活動時，如有跨縣市飛航情形，應向哪個機關提出申請？", "options": {"a": "飛經之直轄市、縣（市）政府。", "b": "起飛地點所在直轄市、縣（市）政府提出申請，經所在地及跨縣市政府同意。", "c": "降落地點所在直轄市、縣（市）政府。", "d": "降落地點所鄰近直轄市、縣（市）政府。"}, "answer": "b", "explain": ""}, {"id": "Q112", "description": "當災害發生時，欲於各級政府依災害防救法劃定之警戒區域或指定區域內從事遙控無人機飛航活動者，應聽從何者之統一指揮調度？", "options": {"a": "民航局局長。", "b": "當地警察局局長。", "c": "當地消防局局長。", "d": "各級政府災害應變中心指揮官。"}, "answer": "d", "explain": ""}, {"id": "Q115", "description": "某合格無人機業務團隊受委託以遙控無人機執行山區電纜線路查檢工作。惟因路況不佳，該團隊無法抵達預訂工作區域，為不影響任務進行，成員臨時決定仍將無人機飛至工作區，並以望遠鏡保持與其間之視線接觸。請問該團隊之決定是否違反無人機相關規範？", "options": {"a": "並無違反遙控無人機相關規範。", "b": "已違反遙控無人機相關規範。", "c": "有無違反規範視任務執行結果而定。", "d": "資訊不足，無法判斷。"}, "answer": "b", "explain": ""}, {"id": "Q116", "description": "某無人機團隊獲准於機場跑道上空測試某項酬載功能，有人建議飛得越高越能展現測試成果，請問操作人對於該建議應有哪項認知？", "options": {"a": "活動既經核准，即無飛航高度限制，想飛多高就多高。", "b": "飛航高度未經核准，仍應遵守距地表面不得逾400呎之規定。", "c": "飛航高度聽從現場指揮人員視任務執行狀況決定。", "d": "飛航高度視能見度好壞決定。"}, "answer": "b", "explain": ""}, {"id": "Q117", "description": "某無人機團隊正擬定拍攝一大型廟會活動之飛航計畫，請問該團隊對於其執行之任務，應有下列何種正確認知？", "options": {"a": "團隊技術高超，拍攝時無須特別防護工作。", "b": "為達拍攝效果，於任務中任意變換無人機飛航高度甚至接近人群是可以接受的。", "c": "重量較輕的無人機相對危害較小，故可隨意飛近目標物進行拍攝。", "d": "操作人應領有相應專業操作證，且於執行任務前應申請活動許可。"}, "answer": "d", "explain": ""}, {"id": "Q118", "description": "無人機團隊正在作飛行前準備，臨時被告知因緊急狀況，無人機於飛航時必須裝載由民航局公告之危險物品，請問操作人該有下列哪項正確認知？", "options": {"a": "僅要能確保無人機飛航時之平衡及控制穩定，即同意該要求，否則拒絕該要求。", "b": "未經核准前，依規定不得以無人機裝載危險物品，應直接拒絕該要求。", "c": "如該危險物品之包裝完好且易固定，即同意該要求，否則就拒絕該要求。", "d": "因為緊急狀況，應無條件同意該要求。"}, "answer": "b", "explain": ""}, {"id": "Q120", "description": "遙控無人機飛航活動對於其他航空器活動、地面人群及建築物所帶來之影響顯而易見，請問就操作人而言，應有下列哪項正確觀念？", "options": {"a": "反正其他目標物均很明顯，發現時再緊急避讓即可。", "b": "應於可操作區域進行飛航、遵守相關規定，隨時注意並防止無人機接近任何其他目標物。", "c": "只要於可操作區域內飛航，無人機是否接近其他目標物非操作者的責任。", "d": "進行無人機飛航活動時，若有目視觀察員在側，由目視觀察員全權負責無人機與其他目標物之隔離工作。"}, "answer": "b", "explain": ""}, {"id": "Q121", "description": "某明星正在室外舉行音樂發表會，主辦單位看到現場人山人海，為擴大宣傳效果，臨時打算請某無人機團隊利用無人機於現場人群上空進行投擲紀念版T恤及CD活動，請問下列敘述何者正確？", "options": {"a": "法規已明訂未取得相應專業操作證及事前活動申請許可，不得以遙控無人機進行投擲作業。", "b": "主辦單位只要事先向現場人群說明活動進行方式，即可進行投擲作業。", "c": "只要主辦單位提供之T恤及CD數量能符合無人機酬載需求，即可進行投擲作業。", "d": "使用無人機投擲物件稀鬆平常，毫無安全疑慮，可以直接進行投擲作業。"}, "answer": "a", "explain": ""}, {"id": "Q122", "description": "某電影拍攝作業因取景需求，導演指示團隊將無人機飛入民用航空法所規範之限航區內執行空拍任務，請問下列敘述何者正確？", "options": {"a": "只要在限航區內不要待太久，趕緊拍攝完畢就好。", "b": "非經核准，限航區內不得從事遙控無人機飛航活動。", "c": "若限航區位處人煙罕至處，飛進去拍攝無妨。", "d": "只要有助手協助觀察限航區內狀況，即可飛入拍攝。"}, "answer": "b", "explain": ""}, {"id": "Q126", "description": "某無人機團隊受知名電視台委託，要利用無人機進行即時新聞事件之空拍作業，惟團隊經評估後認為該空拍作業可能存在安全顧慮，請問該團隊面對電視台之委託，採取下列何項作法較為恰當？", "options": {"a": "僅須視操作人經驗決定是否接受該任務。", "b": "視電視台給予酬勞多寡決定是否接受該任務。", "c": "評估有安全顧慮即應婉拒該任務，並詳細解釋其原因。", "d": "視任務活動投保額度高低決定是否接受該任務。"}, "answer": "c", "explain": ""}, {"id": "Q131", "description": "某團隊擁有一架最大起飛重量達30公斤之無人飛機逾半年之久，經過幾次任務後發現該機因某項設計缺失而恐致操作安全疑慮，請問該團隊應有下列何項認知及作為？", "options": {"a": "只要加強操作人技術及應付緊急狀況之能力即可，不須採取其他作為。", "b": "團隊應儘速詢求該無人機設計者，以針對設計缺失進行補正作為。", "c": "於往後每次活動區域內設置安全防護網即可，不須採取其他作為。", "d": "於往後活動前只要記得投保較高額度之保險即可，不須採取其他作為。"}, "answer": "b", "explain": ""}, {"id": "Q132", "description": "某電影公司欲拍攝高速公路警匪追逐場景，為求逼真效果，電影公司要求無人機團隊操作無人機近距離拍攝疾駛於高速公路上之車輛，請問操作人應有哪項正確認知？", "options": {"a": "這是訓練自己技術的好機會，應大膽接受任務。", "b": "看在電影公司給予高額酬勞的份上，理應接受該任務。", "c": "只要團隊多數人認為可以執行，即應接受該任務。", "d": "未經核准飛航前，無人機飛航活動應遠離高速公路至少30公尺以上，該任務顯違反規定，應予以拒絕。"}, "answer": "d", "explain": ""}, {"id": "Q133", "description": "某區域發生強烈地震，造成人員傷亡及財產損害嚴重，某新聞機構要求無人機團隊不待申請，立即趕赴當地執行空拍任務，以便進行獨家即時新聞報導，請問該團隊應有何種正確認知？", "options": {"a": "緊急情況時，應遵守災害防救法之規定，統一聽從政府災害應變中心指揮及調度，不可擅自進行拍攝。", "b": "因屬災害危難事件、人命關天，應不顧一切答應其要求，並立即前往進行拍攝。", "c": "只要取得欲拍攝區域之里長口頭同意後，即可進行拍攝任務。", "d": "只要取得欲拍攝區域之消防主管機關口頭同意後，即可進行拍攝任務。"}, "answer": "a", "explain": ""}, {"id": "Q134", "description": "某大學順應潮流成立無人機社團，其成員亦將成為該校未來無人機業務執行主力。學校為擴大宣傳，臨時決定某日下午於校園空曠處進行無人機飛航展示活動，請問下列認知何者正確？", "options": {"a": "校園內飛航無受法規限制，可盡情執行飛航展示活動。", "b": "只要經學校同意，並於活動現場派員口頭宣導注意事項，即可任意進行飛航展示活動。", "c": "該校仍應於完成飛航活動許可申請後，始得依申請內容進行飛航操作展示。", "d": "為展示無人機性能，刻意將無人機飛越人群、教室或辦公區域是可允許的。"}, "answer": "c", "explain": ""}, {"id": "Q135", "description": "小華為某公司無人機業務部門主管兼資深飛手，請問有關每趟飛航任務之操作紀錄、無人機維護紀錄及相關修理紀錄等處置事宜，小華應有哪項正確認知？", "options": {"a": "法規針對相關紀錄之處置並無明確規範，隨公司高層想怎麼處理都可以。", "b": "相關紀錄內容隨便寫寫就好，反正任務完成、機器能正常運作即可。", "c": "明知飛航任務中發生異常現象，為利團隊績效，自行研判若不嚴重，即不須特別紀錄。", "d": "公司應妥善保存每趟任務之相關紀錄，法規針對紀錄事項及保存期限等亦有相關規定。"}, "answer": "d", "explain": ""}, {"id": "Q136", "description": "一架最大起飛重量5公斤且裝置導航設備之遙控無人機於海岸邊執行空拍任務時，因操作不當而致失控墜海，目視機體已明顯損壞無法繼續使用。請問操作人應採取下列哪項正確作為？", "options": {"a": "只要無造成人員傷亡，即不須作任何處置。", "b": "只要無造成人員傷亡，只需要把墜海的無人機拾回即可。", "c": "無論有無造成人員傷亡，應於事件發生後24小時內依規定通報當地消防單位。", "d": "無論有無造成人員傷亡，應於事件發生後24小時內依規定通報民航局。"}, "answer": "d", "explain": ""}, {"id": "Q137", "description": "某無人機團隊正規劃一場沙灘音樂饗宴任務，其內容包括：「日落後利用無人機於參與民眾上空噴灑彩色粉末，以製造繽紛效果」。請問下列何者為該團隊執行任務前最重要之考量因素？", "options": {"a": "操作者之飛航技術及膽識是否足夠。", "b": "彩色粉末之數量是否足夠活動需求。", "c": "該任務是否已經申請核准，操作者是否領有相應操作證。", "d": "現場燈光及音效設備是否良好，以營造絢麗歡樂效果。"}, "answer": "c", "explain": ""}, {"id": "Q138", "description": "某公司無人機團隊正執行飛航任務，突接獲上層電話指示須臨時將無人機飛至前方人群密集之住宅區拍攝所需影像，並表示公司先前已獲得民航局相關安全能力審查通過，可放心飛入執行拍攝。」請問該團隊應有下列何種正確認知？", "options": {"a": "當然是聽從上層的要求，直接飛入住宅區進行拍攝。", "b": "活動前仍應依規定向民航局申請執行許可後，使得進行拍攝。", "c": "只要臨時通知所在地轄區派出所後，即可進行拍攝。", "d": "只要臨時通知所在地轄區里長辦公室後，即可進行拍攝。"}, "answer": "b", "explain": ""}, {"id": "Q140", "description": "假設現有以下資訊： 1.日落時間為本地時間18點46分。 2.民用暮光時間為19點12分。 3.航海暮光時間為19點43分。 4.天文暮光時間為20點16分。 請問無人機操作人應於何時終止飛航活動？", "options": {"a": "18點46分。", "b": "19點12分。", "c": "19點43分。", "d": "20點16分。"}, "answer": "a", "explain": ""}, {"id": "Q141", "description": "無人機團隊正評估釣客欲於近海海域使用無人機至離岸數公里處進行投放釣餌之操作需求，請問下列哪項說明為該團隊最重要之考量因素？", "options": {"a": "無人機裝載釣餌前後之重量與重心變化是否於其操作限制內。", "b": "無人機之動力來源是否足以支撐該項投擲任務之完成。", "c": "涉及利用無人機投擲物體之限制操作項目，應申請活動許可並應考取相關操作證。", "d": "釣客是否投保相關保險並願意簽署任務執行切結書。"}, "answer": "c", "explain": ""}, {"id": "Q142", "description": "某雜誌社委託無人機團隊利用無人機執行一項具有相當危險性之飛航任務，負責人並保證：「於執行任務過程中若發生任何事件，導致人員死傷或財物毀損，均由雜誌社全權負責，請團隊安心進行任務。」請問有關該負責人之保證，下列敘述何者正確？", "options": {"a": "雜誌社要能提供書面保證及繳交足額保證金，使得作為團隊免責之依據。", "b": "只要不是故意造成人員死傷或財物毀損，任一方均不須負賠償責任。", "c": "只要活動經申請核准執行，且已作有必要防護措施者，任一方均不須負賠償責任。", "d": "操作無人機造成人員死傷或財物毀損，不論故意或過失，應由所有人及操作人負連帶賠償責任。"}, "answer": "d", "explain": ""}, {"id": "Q145", "description": "某無人機團隊已獲得民航局安全能力審查核可，得於人群聚集處進行空拍任務。於某次任務執行前，團隊依規定向民航局申請活動許可，惟對於是否應向當地地方政府申請一事意見相左，請問下列敘述何者正確？", "options": {"a": "法律為民航局訂定的，當然只要向民航局申請即可。", "b": "一般而言，經民航局核准後，地方政府通常不會有意見，故不須再做申請。", "c": "除獲民航局許可外，仍應取得地方政府之同意，故還是得做申請。", "d": "是否要向地方政府申請，依執行任務之危險度或複雜度而定。"}, "answer": "c", "explain": ""}, {"id": "Q146", "description": "有關操作人從事遙控無人機飛航活動時應注意之距離限制，下列何者為正確？", "options": {"a": "應至少距高速公路範圍10公尺以上。", "b": "應至少距高架鐵路範圍20公尺以上。", "c": "應至少距建築物及障礙物範圍30公尺以上。", "d": "以上均正確。"}, "answer": "c", "explain": ""}]</script>

  <script>
  (function(){
    // 上一頁／下一頁：href 由 build.py 依頁序填入；href 為 # 時不動作。鍵盤 ← → 與 PageUp／PageDown 同步觸發，輸入框、對話框內不觸發。
    var prev=document.querySelector('[data-nav="prev"]'),next=document.querySelector('[data-nav="next"]');
    function go(a){var h=a&&a.getAttribute('href');if(h&&h!=='#')location.href=h}
    [prev,next].forEach(function(a){a.addEventListener('click',function(e){if(a.getAttribute('href')==='#')e.preventDefault()})});
    document.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(e.target&&e.target.closest&&e.target.closest('input,textarea,select,video,audio,[contenteditable]'))return;if(document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(next);if(e.key==='ArrowLeft'||e.key==='PageUp')go(prev)});
  })();
  </script>
</body>
</html>
