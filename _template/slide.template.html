<!-- 產生器範本：由 build.py 讀取，{{...}} 由 pages/*.md 填入。頁首帶、頁尾署名、翻頁按鈕與動畫、雷達背景都固定在這裡，不在內容檔裡。 -->
<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a09">
  <meta name="description" content="{{description}}">
  <title>{{page_title}}</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="slide.css">
{{component_css}}</head>
<body class="slide-fixed">
  <canvas id="radar" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="slide-top" role="banner"><span class="eyebrow"><b>無人機</b> ／ 專業基本級操作證</span></div>
    <header class="slide-head">
      <h1 class="title-line">
        <span class="title-main">{{title_main}}</span>
        <span class="title-sep" aria-hidden="true">－</span>
        <span class="title-sub">{{title_sub}}</span>
      </h1>
      <p class="title-lead">{{title_lead}}</p>
    </header>

    <section class="slide-content">
{{content}}
    </section>

    <footer class="slide-foot">
      <a class="nav-btn nav-prev" href="{{prev_href}}" data-nav="prev" aria-label="上一頁" title="上一頁">
        <span class="nav-text">上一頁</span>
        <svg class="nav-icon icon-rc" viewBox="0 0 64 44" aria-hidden="true" focusable="false">
          <!-- 天線 -->
          <path d="M14 16 L8 3" /><path d="M50 16 L56 3" />
          <circle cx="8" cy="3" r="1.6" class="fill" /><circle cx="56" cy="3" r="1.6" class="fill" />
          <!-- 機身 -->
          <rect x="6" y="14" width="52" height="26" rx="7" />
          <!-- 螢幕 -->
          <rect x="26" y="19" width="12" height="7" rx="1.5" class="screen" />
          <!-- 左右搖桿 -->
          <circle cx="17" cy="28" r="6" /><circle cx="17" cy="28" r="1.8" class="fill stick stick-l" />
          <circle cx="47" cy="28" r="6" /><circle cx="47" cy="28" r="1.8" class="fill stick stick-r" />
          <!-- 天線訊號（僅左側；以左天線尖端 8,3 為圓心的兩道波紋，內圈先亮） -->
          <g class="signal"><path class="wave wave-1" d="M3.17 4.29 A5 5 0 0 1 7.56 -1.98" /><path class="wave wave-2" d="M-0.21 5.2 A8.5 8.5 0 0 1 7.26 -5.47" /></g>
          <!-- 開關 -->
          <path d="M28 33 h8" /><path d="M30 36 h4" />
        </svg>
      </a>
      <p>台中市政府輔導　台中無人機創造發展基地－無人機教材 專業基本級操作證</p>
{{foot_link}}      <a class="nav-btn nav-next" href="{{next_href}}" data-nav="next" aria-label="下一頁" title="下一頁">
        <span class="nav-text">下一頁</span>
        <svg class="nav-icon icon-fpv" viewBox="-12 5 112 52" aria-hidden="true" focusable="false">
          <!-- viewBox 從 x=-12、y=5 起算：左側加寬 12 單位放尾流線；圖形整體上移 5 單位，貼近「下一頁」文字（與遙控器對齊） -->
          <!-- 尾流線（與飛行方向平行，微微向右上） -->
          <g class="trail"><path d="M-4 25 l16 -0.8" /><path d="M-11 31 l24 -1.3" /><path d="M-5 37 l18 -0.9" /></g>
          <g class="quad">
            <!-- 靜態抬頭角；CSS 動畫套在外層 .quad，不會覆蓋這個 transform -->
            <g transform="rotate(-8 56 30)">
              <!-- 後方（遠側）機臂、馬達、螺旋槳：較細較小 -->
              <path class="arm arm-far" d="M46.2 24.6 L29.3 13.1" /><path class="arm arm-far" d="M61.8 25.8 L68.7 15.5" />
              <path class="motor" d="M29.3 13.1 v-3" /><path class="motor" d="M68.7 15.5 v-3" />
              <ellipse class="prop prop-far" cx="29.3" cy="10.1" rx="10.2" ry="4.8" /><ellipse class="prop prop-far" cx="68.7" cy="12.5" rx="10.8" ry="5" />
              <!-- 機身：側板（厚度）＋上蓋 -->
              <path class="side" d="M45.9 29.2 L50.3 34.2 L65.8 35.4 L67.7 31 v2.6 L65.8 38 L50.3 36.8 L45.9 31.8 Z" />
              <path class="plate" d="M67.7 31 L65.8 35.4 L50.3 34.2 L45.9 29.2 L46.2 24.6 L61.8 25.8 Z" />
              <!-- 天線（機尾，向後上方） -->
              <path d="M48.4 27.2 L44 13.5" /><circle cx="44" cy="13.5" r="1.2" class="fill" />
              <!-- 前方（近側）機臂、馬達 -->
              <path class="arm arm-near" d="M50.3 34.2 L43.3 44.5" /><path class="arm arm-near" d="M65.8 35.4 L81.3 46.9" />
              <path class="motor" d="M43.3 44.5 v-3" /><path class="motor" d="M81.3 46.9 v-3" />
              <!-- 前方（近側）螺旋槳：較大 -->
              <ellipse class="prop" cx="43.3" cy="41.5" rx="11.4" ry="5.4" /><ellipse class="prop" cx="81.3" cy="43.9" rx="12" ry="5.8" />
            </g>
          </g>
        </svg>
      </a>
    </footer>
  </main>

  <script src="app.js"></script>
{{extra_scripts}}  <script>
  (function(){
    // 上一頁／下一頁：href 由 build.py 依頁序填入；href 為 # 時不動作。鍵盤 ← → 與 PageUp／PageDown 同步觸發，輸入框、對話框內不觸發。
    var prev=document.querySelector('[data-nav="prev"]'),next=document.querySelector('[data-nav="next"]');
    function go(a){var h=a&&a.getAttribute('href');if(h&&h!=='#')location.href=h}
    [prev,next].forEach(function(a){a.addEventListener('click',function(e){if(a.getAttribute('href')==='#')e.preventDefault()})});
    document.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(e.target&&e.target.closest&&e.target.closest('input,textarea,select,video,audio,[contenteditable]'))return;if(document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(next);if(e.key==='ArrowLeft'||e.key==='PageUp')go(prev)});
  })();
  </script>
</body>
</html>
